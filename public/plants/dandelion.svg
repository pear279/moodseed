<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <radialGradient id="dPuff" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F6F3EC"/>
      <stop offset="1" stop-color="#E8E0CE"/>
    </radialGradient>
    <linearGradient id="dStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC08A"/>
      <stop offset="1" stop-color="#4C7A4E"/>
