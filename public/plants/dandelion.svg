    <g stroke="#D8CFB8" stroke-width="2.5" opacity="0.8">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="106" y2="-106"/>
      <line x1="0" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="0" x2="106" y2="106"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="-106" y2="106"/>
      <line x1="0" y1="0" x2="-150" y2="0"/>
      <line x1="0" y1="0" x2="-106" y2="-106"/>
      <line x1="0" y1="0" x2="75" y2="-130"/>
      <line x1="0" y1="0" x2="130" y2="-75"/>
      <line x1="0" y1="0" x2="130" y2="75"/>
      <line x1="0" y1="0" x2="75" y2="130"/>
      <line x1="0" y1="0" x2="-75" y2="130"/>
      <line x1="0" y1="0" x2="-130" y2="75"/>
      <line x1="0" y1="0" x2="-130" y2="-75"/>
      <line x1="0" y1="0" x2="-75" y2="-130"/>
    </g>
    <g fill="#FFFFFF" stroke="#E8E0CE" stroke-width="2">
