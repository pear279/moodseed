      <circle cx="0" cy="-150" r="11"/>
      <circle cx="106" cy="-106" r="11"/>
      <circle cx="150" cy="0" r="11"/>
      <circle cx="106" cy="106" r="11"/>
      <circle cx="0" cy="150" r="11"/>
      <circle cx="-106" cy="106" r="11"/>
      <circle cx="-150" cy="0" r="11"/>
      <circle cx="-106" cy="-106" r="11"/>
      <circle cx="75" cy="-130" r="10"/>
      <circle cx="130" cy="-75" r="10"/>
      <circle cx="130" cy="75" r="10"/>
      <circle cx="75" cy="130" r="10"/>
      <circle cx="-75" cy="130" r="10"/>
      <circle cx="-130" cy="75" r="10"/>
      <circle cx="-130" cy="-75" r="10"/>
      <circle cx="-75" cy="-130" r="10"/>
