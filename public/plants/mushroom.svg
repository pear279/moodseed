<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="mCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98A6B"/>
      <stop offset="1" stop-color="#8A5C40"/>
    </linearGradient>
    <linearGradient id="mStem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E4D2"/>
      <stop offset="1" stop-color="#D9C6AB"/>
    </linearGradient>
    <radialGradient id="mGround" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9BC4A0"/>
      <stop offset="1" stop-color="#5B8C5A"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <ellipse cx="300" cy="500" rx="230" ry="60" fill="url(#mGround)"/>
  <ellipse cx="300" cy="500" rx="230" ry="60" fill="#2E3A2E" opacity="0.06"/>

  <!-- stem -->
  <path d="M250 470 c0-120 20-170 50-190 c30 20 50 70 50 190 z" fill="url(#mStem)"/>

  <!-- cap -->
  <path d="M150 290 c0-120 70-190 150-190 s150 70 150 190 z" fill="url(#mCap)"/>
  <!-- cap underside -->
  <ellipse cx="300" cy="290" rx="150" ry="26" fill="#6E4730"/>

  <!-- spots -->
  <g fill="#F4E9DA" opacity="0.9">
    <circle cx="240" cy="190" r="22"/>
    <circle cx="330" cy="150" r="16"/>
    <circle cx="380" cy="230" r="14"/>
    <circle cx="210" cy="260" r="12"/>
    <circle cx="300" cy="240" r="18"/>
  </g>

  <!-- small grass -->
  <g stroke="#7BA05B" stroke-width="5" stroke-linecap="round">
    <path d="M120 500 q10-30 0-54"/>
    <path d="M470 500 q-10-30 0-54"/>
    <path d="M180 510 q8-24 0-42"/>
    <path d="M420 510 q-8-24 0-42"/>
  </g>
</svg>
