name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 类型检查 + 生产构建（前端核心门禁）
      - run: pnpm build

      # 完整 API 冒烟测试需本地 wrangler + D1，见 README「本地开发」；此处不做。
